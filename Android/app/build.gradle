plugins {
    id "com.android.application"
}

android {
    namespace "com.codex.basketpet"
    compileSdk 35

    defaultConfig {
        applicationId "com.codex.basketpet"
        minSdk 26
        targetSdk 33
        versionCode 5
        versionName "5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
